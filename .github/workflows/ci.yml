# Build and test CoffeeCatch across compilers, architectures, macOS, UBSan and TSan.
# The library ships as a hand-written Makefile, so CI drives it directly: that
# is exactly what rotted unnoticed before (transposed calloc args and a stale
# link order broke `make` on modern toolchains, with no CI to catch it).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build+test (${{ matrix.arch }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, runner: ubuntu-24.04,     cc: gcc,   cxx: g++ }
          - { arch: x86-64, runner: ubuntu-24.04,     cc: clang, cxx: clang++ }
          - { arch: arm64,  runner: ubuntu-24.04-arm, cc: gcc,   cxx: g++ }
          - { arch: arm64,  runner: ubuntu-24.04-arm, cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang

      # `make all` builds the static lib, shared lib, tests, and sample under
      # the chosen compiler; `make check` runs the test suite. CC/CXX are set as
      # a matching pair so the C++ suite is not silently built with the default.
      - name: Build and test
        run: make all check CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}

  unwind:
    name: build+test (x86-64, gcc, USE_UNWIND)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      # USE_UNWIND is normally Android-only, so the _Unwind_Backtrace path and
      # its nested-fault guard never reach the legs above. Forcing it on here
      # is the only coverage this code gets outside an NDK build.
      - name: Build and test with USE_UNWIND
        run: make all check CPPFLAGS=-DUSE_UNWIND CFLAGS="-O2 -g -funwind-tables"

      # The JNI layer only builds a Java stack trace when a backtrace exists,
      # so its test runs here. It needs the runner's JDK headers but no JVM.
      - name: Test the JNI layer with USE_UNWIND
        run: |
          set -euo pipefail
          test -r "$JAVA_HOME/include/jni.h"
          make check-jni CPPFLAGS=-DUSE_UNWIND CFLAGS="-O2 -g -funwind-tables"

  ubsan:
    name: sanitizer (ubsan, gcc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      # UBSan, but no ASan: coffeecatch installs its own SIGSEGV/SIGABRT/...
      # handlers and a per-thread alternate signal stack, which ASan's own
      # signal handling and altstack cannot coexist with (every intentional
      # crash then dies uncaught). UBSan installs no signal handlers, so it
      # runs the suite as-is and still checks the C for alignment, integer
      # overflow, shift, and other UB. Flags ride in via CFLAGS/LDFLAGS, which
      # the Makefile appends its mandatory flags onto; every finding aborts.
      - name: Build and run under UBSan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          make check \
            CFLAGS="-O1 -g -fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=undefined"

  tsan:
    name: sanitizer (tsan, clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang

      # TSan checks the refcount and alarm flag shared with the signal handler.
      - name: Build and run under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          make check CC=clang CXX=clang++ \
            CFLAGS="-O1 -g -fsanitize=thread" \
            CXXFLAGS="-O1 -g -fsanitize=thread" \
            LDFLAGS="-fsanitize=thread"

  macos:
    name: build+test (macOS ${{ matrix.arch }}, clang)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos defaults to Apple Silicon; macos-26-intel will be the last Intel image.
          - { arch: arm64,  runner: macos-latest }
          - { arch: x86-64, runner: macos-26-intel }
    steps:
      - uses: actions/checkout@v7

      # The Makefile is portable (it switches to a .dylib link on Darwin), and
      # the tests link the static archive, so macOS runs the same
      # `make all check` on a second libc/kernel and on Apple clang.
      - name: Build and test
        run: make all check
